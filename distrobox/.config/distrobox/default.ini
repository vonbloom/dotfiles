# [playground] is the bare base shared by both boxes and a clean place to try packages before
# adding them to [userland]. [userland] is playground plus its own packages and exports.
# Included keys accumulate and cannot be cleared, so keep [playground] to what its hooks need.

[playground]
image=docker.io/library/archlinux:latest
volume=/etc/fonts/local.conf:/etc/fonts/local.conf:ro
additional_packages="fontconfig cachyos-keyring"
additional_flags="--env DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock"
pre_init_hooks="$HOME/.config/distrobox/pre_init_distrobox_assemble.sh"
init_hooks=fc-cache -f
init_hooks=sudo mkdir -p /etc/containers/containers.conf.d && printf "[engine]\nremote = true\n" | sudo tee /etc/containers/containers.conf.d/99-remote.conf >/dev/null

[userland]
include=playground
start_now=true
additional_packages="brave-bin pipewire-pulse libpulse"
additional_packages="visual-studio-code-bin podman git ttf-jetbrains-mono-nerd noto-fonts-emoji"
additional_packages="neovim btop fastfetch fzf zsh-completions"
# GTK3 theme switched between light and dark by darkman on the host (shared dconf)
additional_packages="thunar gvfs gvfs-smb adw-gtk-theme"
additional_packages="ansible ansible-lint"
exported_apps="brave code thunar"
exported_bins="/usr/bin/btop /usr/bin/code /usr/bin/nvim /usr/bin/ansible /usr/bin/ansible-playbook /usr/bin/ansible-vault /usr/bin/ansible-lint"
exported_bins_path="/home/roger/.local/bin"
