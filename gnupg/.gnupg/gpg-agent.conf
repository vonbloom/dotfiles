enable-ssh-support
# pinentry-gtk, not the wrapper's first choice: with gcr installed (gnome-keyring, since 2026-10-08)
# /usr/bin/pinentry picks pinentry-gnome3, whose GNOME prompt does not follow the desktop's style
pinentry-program /usr/bin/pinentry-gtk
# Keep the passphrase in the agent's memory for 1 hour since its last use, 8 hours at most (a
# workday): the defaults (10 min and 2 h, SSH 30 min and 2 h) asked for it too often. Lower them
# again here if wanted and run `gpg-connect-agent reloadagent /bye`. The passphrase is never saved
# in the keyring ("Save in password manager"): any program of the session could read it there
default-cache-ttl 3600
max-cache-ttl 28800
default-cache-ttl-ssh 3600
max-cache-ttl-ssh 28800
